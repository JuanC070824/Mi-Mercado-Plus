# Corre las pruebas del backend en cada commit. Render solo despliega
# los commits de develop cuyas pruebas pasaron (autoDeployTrigger: checksPass).
name: Backend

on:
  push:
    branches: [develop, main, Michael]
    paths:
      - 'mimercado_backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'mimercado_backend/**'
      - '.github/workflows/backend.yml'

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mimercado_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mimercado_backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas (SQLite en memoria, sin tocar Supabase)
        run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
